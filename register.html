<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Urban Surplus Food Redistribution</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar Injection -->
  <div id="navbar-placeholder"></div>

  <main class="container">
    <div class="card">
      <h2>Create Account</h2>
      <p class="subtitle">Join the surplus food redistribution network</p>

      <!-- Feedback Banners -->
      <div id="serverError" class="server-error" style="display: none;"></div>
      <div id="serverSuccess" class="server-success" style="display: none;"></div>

      <form id="registerForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" required>
            <small class="error-text" id="firstNameError"></small>
          </div>
          <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" required>
            <small class="error-text" id="lastNameError"></small>
          </div>
        </div>

        <div class="form-group">
          <label for="phone_number">Phone Number</label>
          <input type="tel" id="phone_number" name="phone_number" placeholder="07XXXXXXXX" required>
          <small class="error-text" id="phoneError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="example@domain.com" required>
          <small class="error-text" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a strong password" required>
          <small class="error-text" id="passwordError"></small>
        </div>

        <div class="form-group">
          <label for="role">Register As</label>
          <select id="role" name="role" required>
            <option value="" disabled selected>Select user role</option>
            <option value="consumer">Consumer</option>
            <option value="vendor">Vendor</option>
          </select>
          <small class="error-text" id="roleError"></small>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
      </form>

      <p class="footer-text">
        Already have an account? <a href="login.html">Sign In here</a>
      </p>
    </div>
  </main>

  <!-- Dynamic Footer Injection -->
  <div id="footer-placeholder"></div>

  <script src="js/load-fragments.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof loadFragment === 'function') {
        await loadFragment('navbar-placeholder', 'includes/navbar.html');
        await loadFragment('footer-placeholder', 'includes/footer.html');
      }
    });

    const registerForm   = document.getElementById('registerForm');
    const firstNameInput = document.getElementById('first_name');
    const lastNameInput  = document.getElementById('last_name');
    const phoneInput     = document.getElementById('phone_number');
    const emailInput     = document.getElementById('email');
    const passwordInput  = document.getElementById('password');
    const roleSelect     = document.getElementById('role');
    const submitBtn      = document.getElementById('submitBtn');

    const serverError    = document.getElementById('serverError');
    const serverSuccess  = document.getElementById('serverSuccess');

    function displayError(msg) {
      serverError.textContent = msg;
      serverError.style.display = 'block';
    }

    function clearBanners() {
      serverError.textContent = '';
      serverError.style.display = 'none';
      serverSuccess.textContent = '';
      serverSuccess.style.display = 'none';
    }

    registerForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      clearBanners();

      if (!firstNameInput.value.trim() || !lastNameInput.value.trim() || !phoneInput.value.trim() || !emailInput.value.trim() || !passwordInput.value || !roleSelect.value) {
        displayError('Please complete all form fields.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      const formData = {
        first_name: firstNameInput.value.trim(),
        last_name: lastNameInput.value.trim(),
        phone_number: phoneInput.value.trim(),
        email: emailInput.value.trim().toLowerCase(),
        password: passwordInput.value,
        role: roleSelect.value
      };

      try {
        const response = await fetch('api/register.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        // Safely parse JSON response
        const textData = await response.text();
        let result;
        try {
          result = JSON.parse(textData);
        } catch (jsonErr) {
          console.error("Server output raw non-JSON text:", textData);
          displayError("Server returned an invalid response. Check PHP logs or Network tab.");
          return;
        }

        if (response.ok && result.success) {
          serverSuccess.textContent = result.message || 'Account created successfully!';
          serverSuccess.style.display = 'block';
          
          const targetUrl = result.data?.role === 'vendor' ? 'vendor-details.html' : 'login.html';
          setTimeout(() => {
            window.location.href = result.redirectUrl || targetUrl;
          }, 1200);
        } else {
          displayError(result.message || 'Registration failed. Please try again.');
        }
      } catch (err) {
        console.error('Fetch execution error:', err);
        displayError('Connection error: Make sure Apache is running in XAMPP and you access the page via http://localhost/');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
