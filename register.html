<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Urban Surplus Food Redistribution</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .guest-page .card, .guest-page main { position: relative; z-index: 1; }
    .error-text { color: #d32f2f; font-size: 0.85rem; margin-top: 4px; display: none; }
    .input-error { border: 1px solid #d32f2f !important; }
    .password-wrap { position: relative; }
    .password-wrap input { width: 100%; padding-right: 70px; box-sizing: border-box; }
    .toggle-password { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background: none; border: none; padding: 4px 6px; color: #2d6a4f; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .toggle-password:hover { text-decoration: underline; }
    .pw-checklist { list-style: none; margin: 8px 0 0; padding: 0; font-size: 0.85rem; color: #6b7280; }
    .pw-checklist li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    .pw-checklist input { margin: 0; accent-color: #2d6a4f; pointer-events: none; }
    .pw-checklist li.met { color: #2d6a4f; }
    .server-error { background-color: #fde8e8; color: #d32f2f; padding: 10px 14px; border-radius: 6px; border: 1px solid #f8b4b4; margin-bottom: 16px; font-size: 0.9rem; display: none; }
  </style>
</head>
<body class="guest-page">

  <div class="card">
    <h2>Create Account</h2>
    <p class="subtitle">Join the surplus food redistribution network</p>

    <div id="serverError" class="server-error"></div>

    <form id="registerForm" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-group">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="phone_number">Phone Number</label>
        <input type="text" id="phone_number" name="phone_number" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="">
        <small class="error-text" id="emailError"></small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Create a strong password" required>
          <button type="button" class="toggle-password" data-target="password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <ul class="pw-checklist" id="pwChecklist" style="display:none;">
          <li data-rule="length"><input type="checkbox" disabled> At least 6 characters</li>
          <li data-rule="upper"><input type="checkbox" disabled> An uppercase letter</li>
          <li data-rule="lower"><input type="checkbox" disabled> A lowercase letter</li>
          <li data-rule="number"><input type="checkbox" disabled> A number</li>
          <li data-rule="special"><input type="checkbox" disabled> A special character (! @ # $ %)</li>
        </ul>
        <small class="error-text" id="passwordError"></small>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
          <button type="button" class="toggle-password" data-target="confirm_password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <small class="error-text" id="confirmPasswordError"></small>
      </div>

      <div class="form-group">
        <label for="role">Register As</label>
        <select id="role" name="role" required>
          <option value="" disabled selected>Select user role</option>
          <option value="vendor">Vendor</option>
          <option value="consumer">Consumer</option>
        </select>
        <small class="error-text" id="roleError"></small>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
    </form>

    <p class="footer-text">
      Already have an account? <a href="login.html">Sign In here</a>
    </p>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/load-fragment.js"></script>
  <script>
    loadFragment('footer-placeholder', 'includes/footer.html');

    const registerForm = document.getElementById('registerForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');
    const confirmError = document.getElementById('confirmPasswordError');
    const roleSelect = document.getElementById('role');
    const submitBtn = document.getElementById('submitBtn');

    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const roleError = document.getElementById('roleError');
    const serverError = document.getElementById('serverError');

    function showError(input, errorEl, message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      if (input) input.classList.add('input-error');
    }

    function clearError(input, errorEl) {
      errorEl.textContent = '';
      errorEl.style.display = 'none';
      if (input) input.classList.remove('input-error');
    }

    function hideServerError() {
      serverError.textContent = '';
      serverError.style.display = 'none';
    }

    function displayServerError(message) {
      serverError.textContent = message;
      serverError.style.display = 'block';
    }

    function validateEmail() {
      const email = emailInput.value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailPattern.test(email)) {
        showError(emailInput, emailError, 'Please enter a valid email address.');
        return false;
      }

      const localPart = email.split('@')[0];
      if (/^\d+$/.test(localPart) || localPart === '123') {
        showError(emailInput, emailError, 'Email username cannot be purely numbers or "123".');
        return false;
      }

      clearError(emailInput, emailError);
      return true;
    }

    // Password rules, shown as a checklist that disappears once every rule is met.
    const PASSWORD_RULES = {
      length:  p => p.length >= 6,
      upper:   p => /[A-Z]/.test(p),
      lower:   p => /[a-z]/.test(p),
      number:  p => /[0-9]/.test(p),
      special: p => /[^A-Za-z0-9]/.test(p)
    };
    const pwChecklist = document.getElementById('pwChecklist');

    // Ticks the rules that are met. Returns true when all of them are.
    function updateChecklist() {
      const password = passwordInput.value;
      let allMet = true;
      pwChecklist.querySelectorAll('li').forEach(li => {
        const ok = PASSWORD_RULES[li.dataset.rule](password);
        li.classList.toggle('met', ok);
        li.querySelector('input').checked = ok;
        if (!ok) allMet = false;
      });
      pwChecklist.style.display = allMet ? 'none' : 'block';
      return allMet;
    }

    function validatePassword() {
      const allMet = updateChecklist();
      if (!allMet) {
        passwordInput.classList.add('input-error');
        return false;
      }
      clearError(passwordInput, passwordError);
      return true;
    }

    function validateConfirm() {
      if (confirmInput.value.length === 0) {
        showError(confirmInput, confirmError, 'Please confirm your password.');
        return false;
      }
      if (confirmInput.value !== passwordInput.value) {
        showError(confirmInput, confirmError, 'Passwords do not match.');
        return false;
      }
      clearError(confirmInput, confirmError);
      return true;
    }

    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        btn.setAttribute('aria-pressed', String(show));
      });
    });

    emailInput.addEventListener('input', () => {
      hideServerError();
      validateEmail();
    });
    passwordInput.addEventListener('focus', updateChecklist);
    passwordInput.addEventListener('input', () => {
      hideServerError();
      validatePassword();
      if (confirmInput.value.length > 0) validateConfirm();
    });
    confirmInput.addEventListener('input', () => {
      hideServerError();
      validateConfirm();
    });

    registerForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideServerError();

      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();
      const isConfirmValid = validateConfirm();

      if (!roleSelect.value) {
        showError(roleSelect, roleError, 'Please select a role.');
        return;
      } else {
        clearError(roleSelect, roleError);
      }

      if (!isEmailValid || !isPasswordValid || !isConfirmValid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      const formData = {
        first_name: document.getElementById('first_name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        phone_number: document.getElementById('phone_number').value.trim(),
        email: emailInput.value.trim().toLowerCase(),
        password: passwordInput.value,
        confirm_password: confirmInput.value,
        role: roleSelect.value
      };

      try {
      
        const response = await fetch('api/register.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const rawText = await response.text();
        let result;
        try {
          result = JSON.parse(rawText);
        } catch (jsonErr) {
          console.error('PHP Outputted Non-JSON:', rawText);
          displayServerError('Server error occurred. Check browser console network tab for PHP errors.');
          return;
        }

        if (response.ok && result.success) {
          const targetUrl = result.data?.role === 'vendor' ? 'vendor-details.html' : 'login.html';
          window.location.href = result.redirectUrl || targetUrl;
        } else {
          displayServerError(result.message || 'Registration failed. Please check your details.');
        }
      } catch (err) {
        console.error('Registration failed:', err);
        displayServerError('Unable to connect to the backend server. Please check your connection.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
