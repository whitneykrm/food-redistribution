<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Food Connect</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-text { color: #d32f2f; font-size: 0.85rem; margin-top: 4px; display: none; }
        .input-error { border: 1px solid #d32f2f !important; }
        .server-error { background-color: #fde8e8; color: #d32f2f; padding: 10px 14px; border-radius: 6px; border: 1px solid #f8b4b4; margin-bottom: 16px; font-size: 0.9rem; display: none; }
        .success-box { background-color: #e8f5ec; color: #1e6b3a; padding: 12px 14px; border-radius: 6px; border: 1px solid #b7e0c4; margin-bottom: 16px; font-size: 0.95rem; display: none; }
        .password-wrap { position: relative; }
        .password-wrap input { width: 100%; padding-right: 70px; box-sizing: border-box; }
        .toggle-password { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background: none; border: none; padding: 4px 6px; color: #2d6a4f; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .toggle-password:hover { text-decoration: underline; }
        /* Same password checklist as the Create Account page */
        .pw-checklist { list-style: none; margin: 8px 0 0; padding: 0; font-size: 0.85rem; color: #6b7280; }
        .pw-checklist li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
        .pw-checklist input { margin: 0; accent-color: #2d6a4f; pointer-events: none; }
        .pw-checklist li.met { color: #2d6a4f; }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <div class="card" style="margin: 40px auto; max-width: 450px;">
            <h2>Reset Password</h2>
            <p class="subtitle" id="subtitle">Choose a new password for your account.</p>

            <div class="server-error" id="serverError"></div>
            <div class="success-box" id="successBox" role="status"></div>

            <form id="resetForm" novalidate style="display: none;">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" placeholder="Create a strong password" required>
                        <button type="button" class="toggle-password" data-target="password" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                    <ul class="pw-checklist" id="pwChecklist" style="display:none;">
                        <li data-rule="length"><input type="checkbox" disabled> At least 6 characters</li>
                        <li data-rule="upper"><input type="checkbox" disabled> An uppercase letter</li>
                        <li data-rule="lower"><input type="checkbox" disabled> A lowercase letter</li>
                        <li data-rule="number"><input type="checkbox" disabled> A number</li>
                        <li data-rule="special"><input type="checkbox" disabled> A special character (! @ # $ %)</li>
                    </ul>
                    <small class="error-text" id="passwordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirm_password" placeholder="Re-enter your password" required>
                        <button type="button" class="toggle-password" data-target="confirm_password" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                    <small class="error-text" id="confirmError"></small>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Update Password</button>
            </form>

            <p class="footer-text" style="margin-top: 16px;" id="footerLink">
                <a href="login.html">Back to Sign In</a>
            </p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/load-fragment.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await loadFragment('navbar-placeholder', 'includes/navbar.html');
            await loadFragment('footer-placeholder', 'includes/footer.html');
        });

        const token = new URLSearchParams(window.location.search).get('token') || '';
        const form = document.getElementById('resetForm');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        const passwordError = document.getElementById('passwordError');
        const confirmError = document.getElementById('confirmError');
        const serverError = document.getElementById('serverError');
        const successBox = document.getElementById('successBox');
        const submitBtn = document.getElementById('submitBtn');

        function setError(input, el, msg) {
            el.textContent = msg;
            el.style.display = msg ? 'block' : 'none';
            input.classList.toggle('input-error', !!msg);
        }
        function setServerError(msg) {
            serverError.textContent = msg;
            serverError.style.display = msg ? 'block' : 'none';
        }

        // Password rules (same as Create Account), shown as a checklist that disappears once every rule is met.
        const PASSWORD_RULES = {
            length:  p => p.length >= 6,
            upper:   p => /[A-Z]/.test(p),
            lower:   p => /[a-z]/.test(p),
            number:  p => /[0-9]/.test(p),
            special: p => /[^A-Za-z0-9]/.test(p)
        };
        const pwChecklist = document.getElementById('pwChecklist');

        // Ticks the rules that are met. Returns true when all of them are.
        function updateChecklist() {
            const p = passwordInput.value;
            let allMet = true;
            pwChecklist.querySelectorAll('li').forEach(li => {
                const ok = PASSWORD_RULES[li.dataset.rule](p);
                li.classList.toggle('met', ok);
                li.querySelector('input').checked = ok;
                if (!ok) allMet = false;
            });
            pwChecklist.style.display = allMet ? 'none' : 'block';
            return allMet;
        }

        function validatePassword() {
            const allMet = updateChecklist();
            if (!allMet) {
                passwordInput.classList.add('input-error');
                return false;
            }
            setError(passwordInput, passwordError, '');
            return true;
        }
        function validateConfirm() {
            if (confirmInput.value.length === 0) { setError(confirmInput, confirmError, 'Please confirm your password.'); return false; }
            if (confirmInput.value !== passwordInput.value) { setError(confirmInput, confirmError, 'Passwords do not match.'); return false; }
            setError(confirmInput, confirmError, '');
            return true;
        }

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.textContent = show ? 'Hide' : 'Show';
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                btn.setAttribute('aria-pressed', String(show));
            });
        });

        passwordInput.addEventListener('focus', updateChecklist);
        passwordInput.addEventListener('input', () => {
            setServerError('');
            validatePassword();
            if (confirmInput.value.length > 0) validateConfirm();
        });
        confirmInput.addEventListener('input', () => { setServerError(''); validateConfirm(); });

        // Check the link from the email before showing the form
        (async function checkLink() {
            if (!token) {
                setServerError('This reset link is missing its code. Please request a new one.');
                document.getElementById('footerLink').innerHTML = '<a href="forgot-password.html">Request a new link</a>';
                return;
            }
            try {
                const res = await fetch('api/reset-password.php?token=' + encodeURIComponent(token));
                const data = await res.json();
                if (data.valid) {
                    form.style.display = 'block';
                } else {
                    setServerError('This reset link is invalid or has expired.');
                    document.getElementById('footerLink').innerHTML = '<a href="forgot-password.html">Request a new link</a>';
                }
            } catch (err) {
                setServerError('Unable to reach the server. Please try again.');
            }
        })();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setServerError('');
            const okPw = validatePassword();
            const okConfirm = validateConfirm();
            if (!okPw || !okConfirm) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';

            try {
                const res = await fetch('api/reset-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        password: passwordInput.value,
                        confirm_password: confirmInput.value
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    form.style.display = 'none';
                    document.getElementById('subtitle').style.display = 'none';
                    successBox.textContent = data.message;
                    successBox.style.display = 'block';
                    document.getElementById('footerLink').innerHTML = '<a href="login.html">Go to Sign In</a>';
                } else {
                    setServerError(data.message || 'Could not update your password.');
                }
            } catch (err) {
                setServerError('Unable to reach the server. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
