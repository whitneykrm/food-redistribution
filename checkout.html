<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Food Connect</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <!-- Main brand stylesheet first, then checkout styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <!-- CHECKOUT FORM CONTAINER -->
    <div class="card">
        <h2>Confirm Order &amp; Pay</h2>
        <p class="subtitle">Reserve your item and pay when you collect it</p>

        <!-- Filled in from the listing chosen on the dashboard -->
        <div class="order-summary" id="order-summary">
            <p>Loading your order...</p>
        </div>

        <p id="checkout-error" role="alert"
           style="display: none; color: #b91c1c; font-size: 0.9rem; font-weight: 600; margin-bottom: 14px;"></p>

        <form id="checkout-form" style="display: none;">
            <div class="form-group">
                <label for="payment_method">Payment Method</label>
                <select id="payment_method" name="payment_method" required>
                    <option value="M-Pesa">M-Pesa on Collection</option>
                    <option value="Cash">Cash on Collection</option>
                </select>
            </div>

            <p class="note-collect" style="font-size:0.9rem;color:#6c757d;margin:0 0 16px;">No payment is taken now. You pay the vendor when you collect your order.</p>

            <button type="submit" class="btn-submit" id="submit-btn">Confirm Reservation</button>
        </form>

        <p style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
            <a href="consumer-dashboard.html#browse">&larr; Back to listings</a>
        </p>
    </div>

    <script src="js/load-fragment.js"></script>
    <script>
        loadFragment('navbar-placeholder', 'includes/navbar.html');

        const params = new URLSearchParams(window.location.search);
        // road + area, without repeating the area if the address already contains it
        function pickupText(l) {
            const address = String(l.address || '').trim();
            const area = l.area ? String(l.area).trim() : '';
            if (!area || address.toLowerCase().includes(area.toLowerCase())) return address;
            return address ? address + ', ' + area : area;
        }

        const listingId = params.get('listing');
        let listing = null;

        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const money = (n) => Number(n).toLocaleString('en-KE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

        function showError(message) {
            const el = $('checkout-error');
            el.textContent = message;
            el.style.display = 'block';
        }

        function showProblem(message) {
            $('order-summary').innerHTML = `<p>${esc(message)}</p>`;
            $('checkout-form').style.display = 'none';
        }

        function showListing() {
            $('order-summary').innerHTML = `
                ${listing.image_path ? `<img src="${esc(listing.image_path)}" alt="${esc(listing.item_name)}" onerror="this.style.display='none'" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:12px;">` : ''}
                <p><strong>Item:</strong> ${esc(listing.item_name)}</p>
                <p><strong>Vendor:</strong> ${esc(listing.vendor_name || listing.business_name)}</p>
                <p><strong>Pickup:</strong> ${esc(listing.business_name)}, ${esc(pickupText(listing))}</p>
                <p><strong>Amount Due:</strong> KES ${money(listing.discounted_price)}</p>`;
            $('checkout-form').style.display = 'block';
        }

        async function loadListing() {
            if (!listingId) {
                showProblem('No item was selected. Please pick one from the listings.');
                return;
            }
            try {
                const res = await fetch('api/get-public-listings.php');
                if (res.status === 401) { window.location.href = 'login.html'; return; }
                const data = await res.json();

                if (!data.success) {
                    showProblem(data.message || 'Could not load this item.');
                    return;
                }
                listing = (data.listings || []).find(l => String(l.listings_id) === String(listingId));
                if (!listing) {
                    showProblem('This item is no longer available.');
                    return;
                }

                showListing();
            } catch (err) {
                console.error('Error loading listing:', err);
                showProblem('Something went wrong loading your order. Please go back and try again.');
            }
        }

        $('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!listing) return;
            $('checkout-error').style.display = 'none';

            const method = $('payment_method').value;
            // Wording shown on the confirmation page
            const methodLabel = method === 'Cash' ? 'Cash on Collection' : 'M-Pesa on Collection';

            const btn = $('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Checking your location...';

            // The server checks you are close enough to the vendor, so send the current position
            let position;
            try {
                position = await new Promise((resolve, reject) => {
                    if (!navigator.geolocation) { reject(new Error('unsupported')); return; }
                    navigator.geolocation.getCurrentPosition(resolve, reject,
                        { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
                });
            } catch (geoErr) {
                showError('We need your location to confirm you are near the vendor. Please allow location access in your browser and try again.');
                btn.disabled = false;
                btn.textContent = 'Confirm Reservation';
                return;
            }
            btn.textContent = 'Reserving...';

            try {
                const res = await fetch('api/reserve-listing.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        listing_id: listing.listings_id,
                        // reserve-listing.php accepts exactly 'M-Pesa' or 'cash'
                        payment_method: method === 'Cash' ? 'cash' : 'M-Pesa',
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    })
                });
                if (res.status === 401) { window.location.href = 'login.html'; return; }
                const result = await res.json();

                if (result.success) {
                    // Remember what was just ordered so the next page can show it
                    sessionStorage.setItem('lastReservation', JSON.stringify({
                        order_id: result.order_id,
                        item_name: listing.item_name,
                        payment_method: methodLabel
                    }));
                    window.location.href = 'consumer-qr.html?order_id=' + encodeURIComponent(result.order_id);
                    return;
                }
                showError(result.message || 'Could not reserve this item.');
            } catch (err) {
                console.error('Reservation failed:', err);
                showError('An unexpected error occurred. Please try again.');
            }
            btn.disabled = false;
            btn.textContent = 'Confirm Reservation';
        });

        loadListing();
    </script>
</body>
</html>
