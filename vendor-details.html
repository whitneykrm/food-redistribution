<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Profile · Food Redistribution</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="css/vendor-details.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <main class="container">
        <div class="card" style="margin: 40px auto; max-width: 500px;">
            <h2>Vendor Profile</h2>
            <p class="subtitle" id="page-subtitle">Complete your business and location details</p>

            <div id="alert-msg" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 4px;"></div>

            <div id="profile-view" style="display: none;">
                <dl class="profile-details">
                    <dt>Business Name</dt>
                    <dd id="view-businessname"></dd>

                    <dt>Verification Status</dt>
                    <dd><span id="view-status" class="status-badge"></span></dd>

                    <dt>City</dt>
                    <dd id="view-city"></dd>

                    <dt>Location / Address</dt>
                    <dd id="view-address"></dd>

                    <dt>Map Location</dt>
                    <dd id="view-pin"></dd>
                </dl>

                <button type="button" class="btn-submit" id="edit-btn">Edit Details</button>
            </div>

            <form id="vendor-form" style="display: none;">
                <div class="form-group">
                    <label for="businessname">Business Name</label>
                    <input type="text" id="businessname" name="businessname" placeholder="e.g. Green Grocery Market" required>
                </div>

                <div class="form-group">
                    <label for="verificationstatus">Verification Status</label>
                    <input type="text" id="verificationstatus" value="Pending" readonly style="background-color: #e9ecef; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="e.g. Nairobi" required>
                </div>

                <div class="form-group">
                    <label for="address">Location / Address</label>
                    <input type="text" id="address" name="address" placeholder="e.g. 123 Commercial Street, Kilimani" required>
                </div>

                <div class="form-group">
                    <label for="place-search">Shop Location on Map</label>
                    <div class="map-search">
                        <input type="text" id="place-search" placeholder="Search for a place, e.g. Lavington Mall" autocomplete="off">
                        <button type="button" class="btn-search" id="search-btn">Search</button>
                    </div>
                    <ul class="search-results" id="search-results"></ul>
                    <div id="location-map" style="margin-top: 8px;"></div>
                    <div class="map-actions">
                        <button type="button" class="btn-locate" id="locate-btn">Use my current location</button>
                        <span class="map-status" id="map-status"></span>
                    </div>
                    <div class="map-hint">Search for your shop or click the map to place the pin, and drag it to adjust. Consumers can only reserve when they are close to this spot.</div>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">Complete Registration</button>
                <button type="button" class="button button-light" id="cancel-btn" style="display: none; width: 100%; margin-top: 10px;">Cancel</button>
            </form>
        </div>
    </main>
    <div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="js/load-fragment.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Inject UI fragments
            await loadFragment('navbar-placeholder', 'includes/navbar.html');
            await loadFragment('footer-placeholder', 'includes/footer.html');

            // 2. Initialize page state
            loadVendorProfile();
        });

        // Helper to display feedback messages
        function showAlert(message, isSuccess = true) {
            const alertBox = document.getElementById('alert-msg');
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = isSuccess ? '#d4edda' : '#f8d7da';
            alertBox.style.color = isSuccess ? '#155724' : '#721c24';
            alertBox.textContent = message;
        }

        // Authenticate and Pre-fill Vendor Details
        async function loadVendorProfile() {
            try {
                // Verify user session via PHP API
                const authRes = await fetch('api/session-check.php');
                if (!authRes.ok) {
                    window.location.href = 'login.html';
                    return;
                }

                const authData = await authRes.json();
                if (!authData.success || authData.data.role !== 'vendor') {
                    window.location.href = 'login.html';
                    return;
                }

                // Fetch existing Vendor Details (GET request)
                const vendorRes = await fetch('api/vendor-details.php');
                if (vendorRes.ok) {
                    const vendorData = await vendorRes.json();

                    if (vendorData.success && vendorData.data && vendorData.data.business_name) {
                        currentProfile = vendorData.data;
                        showProfileView();
                        return;
                    }
                }

                // No saved profile yet: first-time setup form
                showForm();
            } catch (err) {
                console.error('Failed to load vendor profile:', err);
                showAlert('Failed to load existing profile details.', false);
                showForm();
            }
        }

        let currentProfile = null;

        function formatStatus(status) {
            const s = status || 'pending';
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        // Show the saved details read-only
        function showProfileView() {
            const v = currentProfile;
            document.getElementById('view-businessname').textContent = v.business_name || '';
            document.getElementById('view-city').textContent = v.city || '';
            document.getElementById('view-address').textContent = v.address || '';
            document.getElementById('view-pin').textContent = (v.latitude != null && v.longitude != null)
                ? 'Pinned (' + Number(v.latitude).toFixed(4) + ', ' + Number(v.longitude).toFixed(4) + ')'
                : 'Not set yet. Please edit your details and mark your shop on the map.';

            const statusEl = document.getElementById('view-status');
            statusEl.textContent = formatStatus(v.verification_status);
            statusEl.className = 'status-badge ' + (v.verification_status === 'verified' ? 'verified' : 'pending');

            document.getElementById('page-subtitle').textContent = 'Your business and location details';
            document.getElementById('vendor-form').style.display = 'none';
            document.getElementById('profile-view').style.display = 'block';
        }

        // Show the form, prefilled when editing an existing profile
        function showForm() {
            document.getElementById('place-search').value = '';
            document.getElementById('search-results').style.display = 'none';
            const v = currentProfile;
            const isEdit = Boolean(v);

            document.getElementById('businessname').value = v?.business_name || '';
            document.getElementById('city').value = v?.city || '';
            document.getElementById('address').value = v?.address || '';
            document.getElementById('verificationstatus').value = formatStatus(v?.verification_status);

            document.getElementById('submit-btn').textContent = isEdit ? 'Update Profile' : 'Complete Registration';
            document.getElementById('cancel-btn').style.display = isEdit ? 'block' : 'none';
            document.getElementById('page-subtitle').textContent = isEdit
                ? 'Update your business and location details'
                : 'Complete your business and location details';

            document.getElementById('profile-view').style.display = 'none';
            document.getElementById('vendor-form').style.display = 'block';

            // The map can only be sized once its box is visible
            initMap();
            if (v && v.latitude != null && v.longitude != null) {
                setPin(Number(v.latitude), Number(v.longitude), true);
            } else {
                pin = null;
                if (marker) { map.removeLayer(marker); marker = null; }
                document.getElementById('map-status').textContent = '';
                map.setView(NAIROBI, 12);
            }
            setTimeout(() => map.invalidateSize(), 50);
        }

        // ── Map pin ───────────────────────────────────────────────
        const NAIROBI = [-1.2921, 36.8219];
        let map = null, marker = null, pin = null;

        function initMap() {
            if (map) return;
            map = L.map('location-map').setView(NAIROBI, 12);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            map.on('click', (e) => setPin(e.latlng.lat, e.latlng.lng, false));
        }

        function setPin(lat, lng, recentre) {
            pin = { lat, lng };
            if (marker) marker.setLatLng([lat, lng]);
            else marker = L.marker([lat, lng], { draggable: true }).addTo(map)
                .on('dragend', () => { const p = marker.getLatLng(); setPin(p.lat, p.lng, false); });
            if (recentre) map.setView([lat, lng], 16);
            document.getElementById('map-status').textContent = 'Location set';
        }

        // ── Place search (OpenStreetMap Nominatim, free, Kenya only) ──
        async function searchPlace() {
            const q = document.getElementById('place-search').value.trim();
            const list = document.getElementById('search-results');
            if (q.length < 3) return;

            list.style.display = 'block';
            list.innerHTML = '<li class="none">Searching...</li>';

            try {
                const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=ke'
                          + '&viewbox=36.65,-1.45,37.10,-1.15&q=' + encodeURIComponent(q);
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                const places = await res.json();

                if (!places.length) {
                    list.innerHTML = '<li class="none">No places found. Try a nearby landmark or click the map.</li>';
                    return;
                }
                list.innerHTML = '';
                places.forEach(p => {
                    const li = document.createElement('li');
                    li.textContent = p.display_name;
                    li.addEventListener('click', () => {
                        initMap();
                        setPin(parseFloat(p.lat), parseFloat(p.lon), true);
                        list.style.display = 'none';
                    });
                    list.appendChild(li);
                });
            } catch (err) {
                console.error('Place search failed:', err);
                list.innerHTML = '<li class="none">Search is unavailable right now. Click the map instead.</li>';
            }
        }

        document.getElementById('search-btn').addEventListener('click', searchPlace);
        document.getElementById('place-search').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); searchPlace(); }   // Enter searches, it does not submit the form
        });

        document.getElementById('locate-btn').addEventListener('click', () => {
            if (!navigator.geolocation) { showAlert('Your browser cannot share its location. Click the map instead.', false); return; }
            navigator.geolocation.getCurrentPosition(
                (pos) => setPin(pos.coords.latitude, pos.coords.longitude, true),
                () => showAlert('Could not get your location. Allow location access, or click the map instead.', false),
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });

        document.getElementById('edit-btn').addEventListener('click', showForm);
        document.getElementById('cancel-btn').addEventListener('click', () => {
            document.getElementById('alert-msg').style.display = 'none';
            showProfileView();
        });

        // Handle Form Submission (POST request to api/vendor-details.php)
        document.getElementById('vendor-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;

            if (!pin) {
                showAlert('Please mark your shop location on the map.', false);
                submitBtn.disabled = false;
                return;
            }

            const payload = {
                business_name: document.getElementById('businessname').value.trim(),
                city: document.getElementById('city').value.trim(),
                address: document.getElementById('address').value.trim(),
                latitude: pin.lat,
                longitude: pin.lng
            };

            try {
                const response = await fetch('api/vendor-details.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showAlert(result.message || 'Profile saved successfully!', true);

                    // Editing an existing profile: go back to the read-only view
                    if (currentProfile) {
                        Object.assign(currentProfile, payload);
                        showProfileView();
                        return;
                    }

                    // First-time setup: continue to the dashboard
                    setTimeout(() => {
                        window.location.href = result.redirectUrl || 'vendor-dashboard.html';
                    }, 1200);
                } else {
                    showAlert(result.message || 'Failed to save vendor details.', false);
                }
            } catch (err) {
                console.error('Error submitting profile:', err);
                showAlert('An error occurred while saving details.', false);
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
