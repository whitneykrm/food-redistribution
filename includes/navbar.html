<style>
    .navbar .navbar-user a.btn-logout {
        display: inline-block;
        background-color: #dc3545;
        color: #ffffff;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        transition: background 0.2s ease;
    }
    .navbar .navbar-user a.btn-logout:hover { background-color: #bd2130; }

    /* Make the whole bar fit: wider container, tighter spacing, Logout never squeezed out */
    @media (min-width: 801px) {
        .navbar-wrapper .navbar { max-width: 1600px; padding: 12px 20px; gap: 1rem; flex-wrap: wrap; row-gap: 8px; }
        .navbar-wrapper .navbar-links { gap: 4px; }
        .navbar-wrapper .navbar-links a { padding: 6px 9px; font-size: 0.92rem; }
        .navbar-wrapper .navbar-user { flex-shrink: 0; gap: 12px; }
    }

    /* Logo image beside the Food Connect name */
    .navbar .brand-header { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .navbar .brand-logo {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        display: block;
    }
    .navbar .brand-name { white-space: nowrap; }

    /* Signed-in user's first name, shown to the left of the Logout button */
    .navbar .navbar-user { display: flex; align-items: center; gap: 16px; }
    .navbar .navbar-user .user-name {
        font-size: 1rem;
        font-weight: 700;
        color: var(--fc-dark, #333);
        white-space: nowrap;
    }

    /* Accessibility: page zoom (vendor dashboard). One small button between the name and
       Logout; its panel floats over the page so the navbar layout is unchanged. */
    .navbar .zoom-controls { position: relative; display: inline-flex; }
    .navbar .zoom-toggle {
        width: 38px;
        height: 38px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        background: #ffffff;
        color: var(--fc-dark, #333);
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
    }
    .navbar .zoom-toggle:hover,
    .navbar .zoom-toggle[aria-expanded="true"] { background: #e8f5e9; }
    .navbar .zoom-panel {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        overflow: hidden;
    }
    .navbar .zoom-panel[hidden] { display: none; }
    .navbar .zoom-panel button {
        min-width: 44px;
        min-height: 40px;
        padding: 0 10px;
        border: 0;
        background: transparent;
        color: var(--fc-dark, #333);
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
    }
    .navbar .zoom-panel button + button { border-left: 1px solid #d0d5dd; }
    .navbar .zoom-panel button:hover:not(:disabled) { background: #e8f5e9; }
    .navbar .zoom-panel button:disabled { color: #a0a4ab; cursor: not-allowed; }
    .navbar .zoom-controls button:focus-visible { outline: 3px solid #1e7d32; outline-offset: -3px; }
    .navbar .zoom-panel .zoom-level { min-width: 64px; font-weight: 600; }
    .navbar .zoom-panel .zoom-small { font-size: 0.8rem; }
    .navbar .zoom-panel .zoom-large { font-size: 1.15rem; }
</style>

<header class="navbar-wrapper">
    <nav class="navbar">
        <!-- Brand / Logo Section -->
        <a href="index.html" class="brand-header">
            <img src="images/logo.svg" alt="Food Connect Logo" width="40" height="40" class="brand-logo">
            <div class="brand-title">
                <span class="brand-name">
                    <span class="text-green">Food</span>
                    <span class="text-orange">Connect</span>
                </span>
                <span class="tagline">Good Food. Greater Impact.</span>
            </div>
        </a>

        <!-- Dynamic Navigation Links -->
        <div class="navbar-links" id="navbar-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </div>

        <!-- Dynamic Auth Action (Login / Logout only) -->
        <div class="navbar-user" id="navbar-user">
            <a href="login.html" id="auth-action-btn" class="btn-nav-login">Login</a>
        </div>
    </nav>
</header>

<script>
(async function initNavbar() {
// Scales the whole page, including pixel-sized text, and remembers the choice.
let ZOOM_KEY = 'fc-vendor-zoom';   // set per role below: fc-vendor-zoom, fc-consumer-zoom, fc-admin-zoom
const ZOOM_MIN = 80, ZOOM_MAX = 150, ZOOM_STEP = 10, ZOOM_DEFAULT = 100;

function readZoom() {
    try {
        const saved = parseInt(localStorage.getItem(ZOOM_KEY), 10);
        if (saved >= ZOOM_MIN && saved <= ZOOM_MAX) return saved;
    } catch (e) { /* storage unavailable: use the default */ }
    return ZOOM_DEFAULT;
}

function saveZoom(level) {
    try { localStorage.setItem(ZOOM_KEY, String(level)); } catch (e) { /* ignore */ }
}

function applyZoom(level) {
    document.documentElement.style.zoom = level === ZOOM_DEFAULT ? '' : (level / 100);
}

function addZoomControls(beforeEl, role) {
    ZOOM_KEY = `fc-${role}-zoom`;
    let level = readZoom();

    const group = document.createElement('div');
    group.id = 'zoom-controls';
    group.className = 'zoom-controls';
    group.innerHTML = `
        <button type="button" class="zoom-toggle" aria-expanded="false" aria-controls="zoom-panel"
                aria-label="Accessibility: page zoom" title="Accessibility: page zoom">Aa</button>
        <div class="zoom-panel" id="zoom-panel" role="group" aria-label="Page zoom" hidden>
            <button type="button" class="zoom-small" data-zoom="out" aria-label="Zoom out" title="Zoom out">A&minus;</button>
            <button type="button" class="zoom-level" data-zoom="reset" title="Reset zoom to 100%"></button>
            <button type="button" class="zoom-large" data-zoom="in" aria-label="Zoom in" title="Zoom in">A+</button>
        </div>
        <span aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;"></span>
    `;

    const toggle = group.querySelector('.zoom-toggle');
    const panel = group.querySelector('.zoom-panel');
    const outBtn = group.querySelector('[data-zoom="out"]');
    const resetBtn = group.querySelector('[data-zoom="reset"]');
    const inBtn = group.querySelector('[data-zoom="in"]');
    const announcer = group.querySelector('[aria-live]');

    const render = (announce) => {
        applyZoom(level);
        resetBtn.textContent = level + '%';
        resetBtn.setAttribute('aria-label', `Zoom is ${level} percent. Reset to 100 percent`);
        outBtn.disabled = level <= ZOOM_MIN;
        inBtn.disabled = level >= ZOOM_MAX;
        if (announce) announcer.textContent = `Zoom ${level} percent`;
    };
    const setLevel = (next) => {
        level = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
        saveZoom(level);
        render(true);
    };
    const openPanel = (open) => {
        panel.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
    };

    toggle.addEventListener('click', () => openPanel(panel.hidden));
    outBtn.addEventListener('click', () => setLevel(level - ZOOM_STEP));
    inBtn.addEventListener('click', () => setLevel(level + ZOOM_STEP));
    resetBtn.addEventListener('click', () => setLevel(ZOOM_DEFAULT));

    // Close with Escape or a click elsewhere
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !panel.hidden) { openPanel(false); toggle.focus(); }
    });
    document.addEventListener('click', (e) => {
        if (!group.contains(e.target)) openPanel(false);
    });

    beforeEl.parentNode.insertBefore(group, beforeEl);   // sits between the name and Logout
    render(false);
}

    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const isActive = (page) => currentPage === page ? 'active' : '';

    // so the navbar Login button is hidden there when nobody is signed in.
    const loginPages = ['index.html', 'login.html'];
    const hideLoginBtn = loginPages.includes(currentPage);
    if (hideLoginBtn) {
        document.getElementById('auth-action-btn').style.display = 'none';   // no flash while the session is checked
    }

    // Returns just the first name from whatever the session endpoint provides
    const firstNameOf = (user) => {
        const full = user.first_name || user.firstname || user.full_name || user.fullname
                  || user.name || user.username || '';
        return String(full).trim().split(/\s+/)[0];
    };

    // Highlight About on the static (pre-login-check) markup too
    document.querySelectorAll('#navbar-links a').forEach(a => {
        if (a.getAttribute('href') === currentPage) a.classList.add('active');
    });

    try {
        const response = await fetch('api/session-check.php');
        const data = await response.json();

        const linksContainer = document.getElementById('navbar-links');
        const actionBtn = document.getElementById('auth-action-btn');

        if (data.loggedIn && data.user) {
            const role = data.role || data.user.role || 'consumer';

            // Show the user's first name to the left of the Logout button
            const firstName = firstNameOf(data.user);
            if (firstName && !document.getElementById('user-name')) {
                const nameEl = document.createElement('span');
                nameEl.id = 'user-name';
                nameEl.className = 'user-name';
                nameEl.textContent = firstName;
                actionBtn.parentNode.insertBefore(nameEl, actionBtn);
            }

            actionBtn.style.display = '';   // signed in: always show Logout
            actionBtn.textContent = 'Logout';
            actionBtn.href = 'logout.php';
            actionBtn.classList.remove('btn-nav-login');
            actionBtn.classList.add('btn-logout');
            actionBtn.onclick = async (e) => {
                e.preventDefault();
                try {
                    await fetch('logout.php', { method: 'POST' });
                } catch (err) {
                    console.log('Logout completed');
                }
                window.location.href = 'index.html';
            };

            if (role === 'vendor') {
                // Vendor sections all live on vendor-dashboard.html and switch using the URL hash.
                const vendorTab = () => currentPage === 'vendor-dashboard.html'
                    ? ((window.location.hash || '#dashboard').replace('#', '') || 'dashboard') : '';
                const vendorLink = (tab, label) =>
                    `<a href="vendor-dashboard.html#${tab}" data-tab="${tab}" class="${vendorTab() === tab ? 'active' : ''}">${label}</a>`;

                linksContainer.innerHTML = `
                    <a href="index.html" class="${isActive('index.html')}">Home</a>
                    <a href="about.html" class="${isActive('about.html')}">About</a>
                    ${vendorLink('dashboard', 'Dashboard')}
                    ${vendorLink('listings', 'My Listings')}
                    ${vendorLink('orders', 'Orders &amp; Payments')}
                    ${vendorLink('reports', 'Reports')}
                    <a href="vendor-details.html" class="${isActive('vendor-details.html')}">Business Profile</a>
                `;

                // Keep the highlight in step when the section changes
                window.addEventListener('hashchange', () => {
                    linksContainer.querySelectorAll('a[data-tab]').forEach(a => {
                        a.classList.toggle('active', a.dataset.tab === vendorTab());
                    });
                });

                // Accessibility: let vendors enlarge or shrink the dashboard
                if (currentPage === 'vendor-dashboard.html' && !document.getElementById('zoom-controls')) {
                    addZoomControls(actionBtn, 'vendor');
                }
            } else if (role === 'admin') {
                linksContainer.innerHTML = `
                    <a href="index.html" class="${isActive('index.html')}">Home</a>
                    <a href="about.html" class="${isActive('about.html')}">About</a>
                    <a href="admin-dashboard.html" class="${isActive('admin-dashboard.html')}">Dashboard</a>
                    <a href="admin-reports.html" class="${isActive('admin-reports.html')}">Reports</a>
                `;

                // Accessibility: page zoom on the admin dashboard and reports
                if (['admin-dashboard.html', 'admin-reports.html'].includes(currentPage)
                        && !document.getElementById('zoom-controls')) {
                    addZoomControls(actionBtn, 'admin');
                }
            } else {
                // Consumer: Home, About, Browse Listings, My Orders, My Points.
                const hashTab = () => (window.location.hash || '#browse').replace('#', '');
                const activeTab = () => currentPage === 'consumer-dashboard.html' ? hashTab()
                                      : currentPage === 'checkout.html' ? 'browse' : '';
                const tabLink = (tab, label) =>
                    `<a href="consumer-dashboard.html#${tab}" data-tab="${tab}" class="${activeTab() === tab ? 'active' : ''}">${label}</a>`;

                linksContainer.innerHTML = `
                    <a href="index.html" class="${isActive('index.html')}">Home</a>
                    <a href="about.html" class="${isActive('about.html')}">About</a>
                    ${tabLink('browse', 'Browse Listings')}
                    ${tabLink('favourites', 'Favourites')}
                    ${tabLink('orders', 'My Orders')}
                    ${tabLink('points', 'My Points')}
                `;

                // Keep the highlight in step when the section changes
                window.addEventListener('hashchange', () => {
                    linksContainer.querySelectorAll('a[data-tab]').forEach(a => {
                        a.classList.toggle('active', a.dataset.tab === activeTab());
                    });
                });

                // Accessibility: page zoom on the consumer dashboard
                if (currentPage === 'consumer-dashboard.html' && !document.getElementById('zoom-controls')) {
                    addZoomControls(actionBtn, 'consumer');
                }
            }
        } else {
            linksContainer.innerHTML = `
                <a href="index.html" class="${isActive('index.html')}">Home</a>
                <a href="about.html" class="${isActive('about.html')}">About</a>
            `;
            actionBtn.style.display = hideLoginBtn ? 'none' : '';
            actionBtn.textContent = 'Login';
            actionBtn.href = 'login.html';
            actionBtn.classList.remove('btn-logout');
            actionBtn.classList.add('btn-nav-login');
            actionBtn.onclick = null;
        }
    } catch (err) {
        console.error('Error initializing navbar:', err);
    }
})();
</script>
