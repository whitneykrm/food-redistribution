<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Complete - Food Connect</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/reservation-complete.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="card">
        <h2 class="complete-title">Reservation Complete!</h2>
        <p class="subtitle">Present this QR code to the vendor to claim your order.</p>

        <div class="qr-frame" id="qr-frame">
            <div id="qr-slot"></div>
        </div>
        <div class="qr-code-line" id="code-slot"></div>

        <p id="qr-fallback" class="qr-fallback" style="display: none;">
            We couldn't show your QR code here. Your reservation is saved, and you can open the code
            any time from <a href="consumer-dashboard.html#orders">My Orders</a>.
        </p>

        <div class="order-summary" id="order-details">
            <p><strong>Order ID:</strong> <span id="d-ref">...</span></p>
            <p><strong>Item:</strong> <span id="d-item">...</span></p>
            <p><strong>Payment Method:</strong> <span id="d-payment">...</span></p>
            <p><strong>Status:</strong> <span id="d-status">...</span></p>
        </div>

        <a href="consumer-dashboard.html#browse" class="btn-submit btn-block-link">Back to Browse</a>
        <a href="consumer-dashboard.html#orders" class="btn-block-link btn-text-link">View My Orders</a>
    </div>
    <div hidden>
        <div id="alert-msg"></div>
        <div id="orders-summary"></div>
        <div id="orders-list"></div>
        <div id="points-available"></div>
        <div id="points-pending"></div>
        <div id="points-spent"></div>
        <div id="points-rule"></div>
        <div id="points-how"></div>
        <div id="redeem-status"></div>
        <div id="redeem-grid"></div>
        <div id="points-activity"></div>
        <div id="listings-grid"></div>
        <div id="results-count"></div>
        <div id="redeem-modal"><div id="redeem-summary"></div></div>
        <div id="qr-modal">
            <div id="qr-details"></div>
            <div class="qr-box" id="qr-box"></div>
            <code class="qr-code-text" id="qr-code-text"></code>
        </div>
    </div>

    <script src="js/load-fragment.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/consumer-core.js?v=5"></script>
    <script src="js/consumer-orders.js?v=5"></script>
    <script src="js/consumer-points.js?v=5"></script>

    <script>
        (async function () {
            loadFragment('navbar-placeholder', 'includes/navbar.html');

            const set = (id, text) => { document.getElementById(id).textContent = text; };

            // Demo reservation from a sample listing (kept in the browser only)
            if (new URLSearchParams(window.location.search).get('demo')) {
                let demo = null;
                try { demo = JSON.parse(sessionStorage.getItem('demoReservation') || 'null'); } catch (e) { /* ignore */ }
                if (demo) {
                    new QRCode(document.getElementById('qr-slot'), {
                        text: ['FOOD CONNECT', 'Order #' + demo.order_id, demo.item_name,
                               demo.business_name + (demo.city ? ', ' + demo.city : ''),
                               'Code: ' + demo.qr_code].join('\n'),
                        width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M
                    });
                    document.getElementById('code-slot').textContent = demo.qr_code;
                    set('d-ref', demo.order_id);
                    set('d-item', demo.item_name);
                    set('d-payment', demo.payment_method);
                    set('d-status', 'Ready for Pickup');
                    return;
                }
            }

            const orderId = Number(new URLSearchParams(window.location.search).get('order_id'));

            // What the checkout page saved about this order (item and payment method)
            let saved = null;
            try { saved = JSON.parse(sessionStorage.getItem('lastReservation') || 'null'); } catch (e) { /* ignore */ }
            if (saved && Number(saved.order_id) !== orderId) saved = null;

            const statusLabels = { reserved: 'Ready for Pickup', collected: 'Collected', cancelled: 'Cancelled' };

            try {
                if (!orderId) throw new Error('No order id in the URL');

                await loadOrders();
                const order = myOrders.find(o => Number(o.order_id) === orderId);
                if (!order) throw new Error('Order not found');

                // Draw the QR with the dashboard's own function, then move it onto this page
                openQrModal(order);
                document.getElementById('qr-modal').classList.remove('open');
                document.getElementById('qr-slot').appendChild(document.getElementById('qr-box'));
                document.getElementById('code-slot').appendChild(document.getElementById('qr-code-text'));

                set('d-ref', 'ORD-' + order.order_no);
                set('d-item', (saved && saved.item_name) || order.item_name || '-');
                set('d-payment', (saved && saved.payment_method) || order.payment_method || '-');
                set('d-status', statusLabels[String(order.status || 'reserved').toLowerCase()] || 'Ready for Pickup');

                sessionStorage.removeItem('lastReservation');
            } catch (err) {
                console.error('Could not show the reservation:', err);
                document.getElementById('qr-frame').style.display = 'none';
                document.getElementById('qr-fallback').style.display = 'block';
                set('d-ref', orderId ? 'ORD-' + orderId : '-');
                set('d-item', (saved && saved.item_name) || '-');
                set('d-payment', (saved && saved.payment_method) || '-');
                set('d-status', 'Ready for Pickup');
            }
        })();
    </script>
</body>
</html>
