<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - Food Connect</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vendor-dashboard.css">
    <style>
        
        .navbar a.btn-logout {
            display: inline-block; background-color: #dc3545; color: #ffffff;
            padding: 10px 20px; border-radius: 8px; font-size: 0.95rem;
            font-weight: 700; text-decoration: none;
        }
        .navbar a.btn-logout:hover { background-color: #bd2130; }
        /* Edit and Delete sit side by side with a small gap */
        .action-buttons { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
        .action-buttons .btn-edit,
        .action-buttons .btn-delete { display: inline-block; width: auto; margin: 0; white-space: nowrap; }
        .btn-edit {
            background: #285da7; color: #fff; border: none; border-radius: 6px;
            padding: 8px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }
        .btn-edit:hover { background: #1f4b88; }
        .edit-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 2000;
            display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .edit-backdrop.open { display: flex; }
        .edit-modal {
            background: #fff; border-radius: 12px; padding: 28px; width: 100%;
            max-width: 460px; max-height: 90vh; overflow-y: auto;
        }
        .edit-modal h3 { margin-bottom: 16px; color: #28a745; }
        .edit-modal .form-group { margin-bottom: 14px; }
        .edit-modal label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
        .edit-modal input, .edit-modal select { width: 100%; box-sizing: border-box; }
        .edit-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
        .edit-cancel {
            background: #fff; color: #333; border: 1px solid #ced4da; border-radius: 6px;
            padding: 10px 18px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="dashboard-container">
        <div id="alert-msg" style="display: none; padding: 12px 16px; margin-bottom: 20px; border-radius: 6px; font-weight: 500;"></div>

        <div class="dashboard-header">
            <h2>Vendor Control Panel</h2>
            <button onclick="alert('Opening QR Camera Scanner...')" class="btn-scan">Scan Consumer QR</button>
        </div>
        <div class="table-card">
            <h3>List Surplus Food Item</h3>
            <p id="verification-notice" class="flash flash-error" style="display: none; margin-bottom: 20px;">
                Your business is pending verification. You can add listings once an admin verifies your account.
            </p>
            <form id="add-listing-form" class="form-row">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" name="item_name" placeholder="e.g. Excess Rice Meals" required>
                </div>
                <div class="form-group">
                    <label for="itemCategory">Category</label>
                    <select id="itemCategory" name="category" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Bakery &amp; Pastries">Bakery &amp; Pastries</option>
                        <option value="Cakes &amp; Desserts">Cakes &amp; Desserts</option>
                        <option value="Cooked Meals">Cooked Meals</option>
                        <option value="Sandwiches &amp; Snacks">Sandwiches &amp; Snacks</option>
                        <option value="Salads &amp; Fresh Produce">Salads &amp; Fresh Produce</option>
                        <option value="Beverages">Beverages</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="itemQuantity">Quantity</label>
                    <input type="number" id="itemQuantity" name="quantity" placeholder="10" min="1" required>
                </div>
                <div class="form-group">
                    <label for="originalPrice">Original Price (KES)</label>
                    <input type="number" id="originalPrice" name="original_price" placeholder="500" min="0" step="1" required>
                </div>
                <div class="form-group">
                    <label for="discountedPrice">Discounted Price (KES)</label>
                    <input type="number" id="discountedPrice" name="discounted_price" placeholder="200" min="0" step="1" required>
                </div>
                <div class="form-group">
                    <label for="expiryTime">Expiry Date/Time</label>
                    <input type="datetime-local" id="expiryTime" name="expiry_time" required>
                </div>
                <div class="form-group btn-align">
                    <button type="submit" class="btn-submit">Add Listing</button>
                </div>
            </form>
        </div>
        <div class="table-card">
            <h3>Active Listings</h3>
            <div id="listings-container">
                <p class="muted">Loading listings...</p>
            </div>
        </div>
    </div>
    <div class="edit-backdrop" id="edit-modal">
        <form class="edit-modal" id="edit-listing-form">
            <h3>Edit Listing</h3>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label for="editName">Item Name</label>
                <input type="text" id="editName" required>
            </div>
            <div class="form-group">
                <label for="editCategory">Category</label>
                <select id="editCategory" required>
                    <option value="Bakery &amp; Pastries">Bakery &amp; Pastries</option>
                    <option value="Cakes &amp; Desserts">Cakes &amp; Desserts</option>
                    <option value="Cooked Meals">Cooked Meals</option>
                    <option value="Sandwiches &amp; Snacks">Sandwiches &amp; Snacks</option>
                    <option value="Salads &amp; Fresh Produce">Salads &amp; Fresh Produce</option>
                    <option value="Beverages">Beverages</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="editQuantity">Quantity</label>
                <input type="number" id="editQuantity" min="1" required>
            </div>
            <div class="form-group">
                <label for="editOriginal">Original Price (KES)</label>
                <input type="number" id="editOriginal" min="0" step="1" required>
            </div>
            <div class="form-group">
                <label for="editDiscounted">Discounted Price (KES)</label>
                <input type="number" id="editDiscounted" min="0" step="1" required>
            </div>
            <div class="form-group">
                <label for="editExpiry">Expiry Date/Time</label>
                <input type="datetime-local" id="editExpiry" required>
            </div>
            <div class="edit-actions">
                <button type="button" class="edit-cancel" id="edit-cancel">Cancel</button>
                <button type="submit" class="btn-submit" id="edit-save">Save Changes</button>
            </div>
        </form>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/load-fragment.js"></script>
    <script>
        loadFragment('nav-placeholder', 'includes/navbar.html');
        loadFragment('footer-placeholder', 'includes/footer.html');

        // Helper function for feedback banners
        function showAlert(message, isSuccess = true) {
            const alertBox = document.getElementById('alert-msg');
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = isSuccess ? '#d4edda' : '#f8d7da';
            alertBox.style.color = isSuccess ? '#155724' : '#721c24';
            alertBox.style.border = isSuccess ? '1px solid #c3e6cb' : '1px solid #f5c6cb';
            alertBox.textContent = message;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function setListingFormEnabled(isVerified) {
            document.getElementById('verification-notice').style.display = isVerified ? 'none' : 'block';
            document.querySelectorAll('#add-listing-form input, #add-listing-form select, #add-listing-form button')
                .forEach(el => { el.disabled = !isVerified; });
        }

        let currentListings = [];
        async function fetchListings() {
            const container = document.getElementById('listings-container');
            try {
                const res = await fetch('api/get-listings.php');
                const rawText = await res.text();
                
                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (e) {
                    console.error('PHP Output error:', rawText);
                    container.innerHTML = '<p class="muted">Server output error. Check console network tab.</p>';
                    return;
                }

                if (!data.success) {
                    if (data.redirectUrl) {
                        window.location.href = data.redirectUrl;
                        return;
                    }
                    container.innerHTML = `<p class="muted">${escapeHtml(data.message || 'Failed to load listings.')}</p>`;
                    return;
                }

                setListingFormEnabled(data.verificationStatus === 'verified');

                if (!data.listings || data.listings.length === 0) {
                    container.innerHTML = '<p class="muted">You haven\'t listed any surplus items yet.</p>';
                    return;
                }

                currentListings = data.listings;
                const rows = data.listings.map(l => {
                    const isExpired = new Date(l.expiry_time) < new Date();
                    const formattedDate = new Date(l.expiry_time).toLocaleString('en-GB', {
                        day: '2-digit',
                        month: 'short',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false
                    });

                    const id = l.listings_id || l.id;

                    return `
                        <tr>
                            <td>#LST-${id}</td>
                            <td>${escapeHtml(l.item_name)}</td>
                            <td>${escapeHtml(l.category || '—')}</td>
                            <td>${l.quantity}</td>
                            <td>KES ${Math.round(parseFloat(l.original_price)).toLocaleString('en-KE')}</td>
                            <td>KES ${Math.round(parseFloat(l.discounted_price)).toLocaleString('en-KE')}</td>
                            <td>${formattedDate}</td>
                            <td><span class="status-${isExpired ? 'inactive' : 'active'}">${isExpired ? 'Expired' : 'Active'}</span></td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-edit" onclick="openEditModal(${id})">Edit</button>
                                    <button class="btn-delete" onclick="deleteListing(${id})">Delete</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Listing ID</th>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Original Price</th>
                                <th>Discounted Price</th>
                                <th>Expires</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                console.error('Error fetching listings:', err);
                container.innerHTML = '<p class="muted">Failed to load active listings.</p>';
            }
        }
        document.getElementById('add-listing-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                item_name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                quantity: parseInt(document.getElementById('itemQuantity').value, 10),
                original_price: parseInt(document.getElementById('originalPrice').value, 10),
                discounted_price: parseInt(document.getElementById('discountedPrice').value, 10),
                expiry_time: document.getElementById('expiryTime').value
            };

            try {
                const res = await fetch('api/create-listing.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const rawText = await res.text();
                let result = JSON.parse(rawText);

                if (result.success) {
                    showAlert(result.message || 'Listing added successfully.', true);
                    document.getElementById('add-listing-form').reset();
                    fetchListings();
                } else {
                    showAlert(result.message || 'Failed to add listing.', false);
                }
            } catch (err) {
                console.error('Error adding listing:', err);
                showAlert('An unexpected error occurred while adding the listing.', false);
            }
        });
        function toLocalInput(mysqlDate) {
            // '2026-11-05 23:00:00' -> '2026-11-05T23:00' for datetime-local
            return String(mysqlDate || '').replace(' ', 'T').slice(0, 16);
        }

        function openEditModal(listingId) {
            const l = currentListings.find(x => Number(x.listings_id || x.id) === Number(listingId));
            if (!l) return;
            document.getElementById('editId').value = listingId;
            document.getElementById('editName').value = l.item_name;
            document.getElementById('editCategory').value = l.category || 'Other';
            document.getElementById('editQuantity').value = l.quantity;
            document.getElementById('editOriginal').value = Math.round(parseFloat(l.original_price));
            document.getElementById('editDiscounted').value = Math.round(parseFloat(l.discounted_price));
            document.getElementById('editExpiry').value = toLocalInput(l.expiry_time);
            document.getElementById('edit-modal').classList.add('open');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('open');
        }

        document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal') closeEditModal();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEditModal(); });

        document.getElementById('edit-listing-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('edit-save');
            saveBtn.disabled = true;

            const payload = {
                listing_id: parseInt(document.getElementById('editId').value, 10),
                item_name: document.getElementById('editName').value,
                category: document.getElementById('editCategory').value,
                quantity: parseInt(document.getElementById('editQuantity').value, 10),
                original_price: parseInt(document.getElementById('editOriginal').value, 10),
                discounted_price: parseInt(document.getElementById('editDiscounted').value, 10),
                expiry_time: document.getElementById('editExpiry').value
            };

            try {
                const res = await fetch('api/update-listing.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = JSON.parse(await res.text());

                closeEditModal();
                if (result.success) {
                    showAlert(result.message || 'Listing updated.', true);
                    fetchListings();
                } else {
                    showAlert(result.message || 'Failed to update listing.', false);
                }
            } catch (err) {
                console.error('Error updating listing:', err);
                closeEditModal();
                showAlert('An unexpected error occurred while updating the listing.', false);
            } finally {
                saveBtn.disabled = false;
            }
        });
        async function deleteListing(listingId) {
            if (!confirm('Delete this listing?')) return;

            try {
                const res = await fetch('api/delete-listing.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ listing_id: listingId })
                });

                const rawText = await res.text();
                let result = JSON.parse(rawText);

                if (result.success) {
                    showAlert(result.message || 'Listing removed.', true);
                    fetchListings();
                } else {
                    showAlert(result.message || 'Failed to delete listing.', false);
                }
            } catch (err) {
                console.error('Error deleting listing:', err);
                showAlert('An unexpected error occurred while deleting the listing.', false);
            }
        }
        fetchListings();
    </script>
</body>
</html>
