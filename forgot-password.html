<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Food Connect</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-text { color: #d32f2f; font-size: 0.85rem; margin-top: 4px; display: none; }
        .input-error { border: 1px solid #d32f2f !important; }
        .server-error { background-color: #fde8e8; color: #d32f2f; padding: 10px 14px; border-radius: 6px; border: 1px solid #f8b4b4; margin-bottom: 16px; font-size: 0.9rem; display: none; }
        .success-box { background-color: #e8f5ec; color: #1e6b3a; padding: 12px 14px; border-radius: 6px; border: 1px solid #b7e0c4; margin-bottom: 16px; font-size: 0.95rem; display: none; }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <div class="card" style="margin: 40px auto; max-width: 450px;">
            <h2>Forgot Password</h2>
            <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

            <div class="server-error" id="serverError"></div>
            <div class="success-box" id="successBox" role="status"></div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="example@domain.com">
                    <small class="error-text" id="emailError"></small>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Send Reset Link</button>
            </form>

            <p class="footer-text" style="margin-top: 16px;">
                Remembered it? <a href="login.html">Back to Sign In</a>
            </p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/load-fragment.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await loadFragment('navbar-placeholder', 'includes/navbar.html');
            await loadFragment('footer-placeholder', 'includes/footer.html');
        });

        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const serverError = document.getElementById('serverError');
        const successBox = document.getElementById('successBox');
        const submitBtn = document.getElementById('submitBtn');

        function setServerError(msg) {
            serverError.textContent = msg;
            serverError.style.display = msg ? 'block' : 'none';
        }

        emailInput.addEventListener('input', () => {
            setServerError('');
            emailError.style.display = 'none';
            emailInput.classList.remove('input-error');
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            setServerError('');
            successBox.style.display = 'none';

            const email = emailInput.value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailError.textContent = 'Please enter a valid email address.';
                emailError.style.display = 'block';
                emailInput.classList.add('input-error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const res = await fetch('api/forgot-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const raw = await res.text();
                let data;
                try {
                    data = JSON.parse(raw);
                } catch (parseErr) {
                    // The server sent back an error page instead of JSON
                    console.error('Server replied with:', raw);
                    setServerError('The server returned an error (HTTP ' + res.status + '). Open the browser console (F12) to see it.');
                    return;
                }

                if (res.ok && data.success) {
                    successBox.textContent = data.message;
                    successBox.style.display = 'block';
                    document.getElementById('forgotForm').style.display = 'none';
                } else {
                    // data.debug only exists while debug is true in includes/mail-config.php
                    setServerError((data.message || 'Could not send the email.') + (data.debug ? ' (' + data.debug + ')' : ''));
                }
            } catch (err) {
                console.error(err);
                setServerError('Unable to reach the server. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
